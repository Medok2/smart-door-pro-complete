[env]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200

[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200

# Libraries
lib_deps =
    bblanchon/ArduinoJson@^6.21.0
    me-no-dev/ESP8266HTTPClient@^1.2
    me-no-dev/ESP Async WebServer@^1.2.3
    me-no-dev/ESPAsyncTCP@^1.2.2
    tzapu/WiFiManager@^0.16.0

# Build flags
build_flags =
    -D DEBUG_ESP_CORE
    -D DEBUG_ESP_WIFI
    -D DEBUG_ESP_TLS
    -Wl,-Teagle.flash.4m2m.ld

# Serial port
upload_port = COM3
monitor_port = COM3
